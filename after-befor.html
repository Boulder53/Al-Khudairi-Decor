<!DOCTYPE html>

<title>مشاريع قبل وبعد</title>

<style>

body{
    font-family: Tahoma, sans-serif;
    margin:0;
    background:#f5f5f5;
    direction:rtl;
}

h1{
    text-align:center;
    padding:25px 0;
    margin:0;
    color:#333;
}

.gallery{
    display:grid;
    grid-template-columns: repeat(auto-fit, minmax(300px,1fr));
    gap:20px;
    padding:20px;
    max-width:1200px;
    margin:auto;
}

.project-box{
    background:white;
    padding:15px;
    border-radius:10px;
    box-shadow:0 0 10px #0001;
    transition:0.3s;
}
.project-box:hover{
    transform:scale(1.02);
}

.project-imgs{
    display:flex;
    gap:10px;
}

.project-imgs img,
.project-imgs video{
    width:50%;
    border-radius:8px;
    cursor:pointer;
    background:#000;
    height:170px;
    object-fit:cover;
}

.project-imgs img:hover{
    opacity:0.8;
}

/* Popup IMAGE */
#popupImgBox{
    position:fixed;
    top:0; left:0;
    width:100%; height:100%;
    background:#0009;
    display:none;
    justify-content:center;
    align-items:center;
    z-index:1000;
}

#popupImg{
    max-width:90%;
    max-height:90%;
    border-radius:10px;
}

#closeImg{
    position:absolute;
    top:20px;
    right:20px;
    background:white;
    padding:8px 15px;
    border-radius:6px;
    cursor:pointer;
    font-weight:bold;
    box-shadow:0 0 10px #0003;
}

/* Popup VIDEO */
#popupVideoBox{
    position:fixed;
    top:0; left:0;
    width:100%; height:100%;
    background:#000d;
    display:none;
    justify-content:center;
    align-items:center;
    z-index:2000;
}

#popupVideo{
    width:90%;
    max-width:900px;
    max-height:90vh;
    border-radius:10px;
    background:#000;
}

#closeVideo{
    position:absolute;
    top:20px;
    left:20px;
    background:white;
    padding:8px 15px;
    border-radius:6px;
    cursor:pointer;
    font-weight:bold;
    box-shadow:0 0 10px #0003;
}

</style>
</head>

<!-- Popup VIDEO -->
<div id="popupVideoBox" onclick="closeVideoPopup()">
    <span id="closeVideo">إغلاق</span>
    <video id="popupVideo" controls></video>
</div>

<script>

function openImg(src){
    document.getElementById("popupImg").src = src;
    document.getElementById("popupImgBox").style.display = "flex";
}

function closeImgPopup(){
    document.getElementById("popupImgBox").style.display = "none";
}

function openVideo(src){
    let v = document.getElementById("popupVideo");
    v.src = src;
    v.play();
    document.getElementById("popupVideoBox").style.display = "flex";
}

function closeVideoPopup(){
    let v = document.getElementById("popupVideo");
    v.pause();
    v.currentTime = 0;
    document.getElementById("popupVideoBox").style.display = "none";
}

</script>
